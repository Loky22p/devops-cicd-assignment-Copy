apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator-app
  annotations:
    gitops-test: "github-auto-sync"
  namespace: calculator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calculator-app
  template:
    metadata:
      labels:
        app: calculator-app
    spec:
      containers:
        - name: calculator-app
          image: 207235249613.dkr.ecr.ap-south-1.amazonaws.com/calculator-app:ci-11
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: calculator-service
  namespace: calculator
spec:
  type: ClusterIP
  selector:
    app: calculator-app
  ports:
    - port: 80
      targetPort: 8080
